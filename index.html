<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Todo</title><script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.1/dist/iife/sdk.js"></script><style>body{background:#0f0f0f;color:#fff;font-family:sans-serif;display:flex;justify-content:center;padding:20px} .box{max-width:480px;width:100%} .input{display:flex;gap:8px;background:#1e1e1e;padding:8px;border-radius:12px;margin-bottom:20px} input{flex:1;background:transparent;border:none;color:#fff;outline:none;padding:8px} button{background:#f24e1e;color:#fff;border:none;padding:10px 16px;border-radius:8px} .todo{background:#1e1e1e;padding:12px;border-radius:10px;display:flex;justify-content:space-between;margin-bottom:8px}</style></head><body><div class="box"><h1>Todo - Appwrite</h1><div class="input"><input id="t" placeholder="Task"><button onclick="add()">Add</button></div><div id="list"></div></div><script>const{Client,TablesDB,ID}=Appwrite;const c=new Client().setEndpoint('https://fra.cloud.appwrite.io/v1').setProject('6ab8f08c000c9977ff82');const db=new TablesDB(c);const DID='6ab8f226000d773ff4ee';const TID='6ab8f54f0021f821e2c4';async function load(){const r=await db.listRows({databaseId:DID,tableId:TID});const l=document.getElementById('list');l.innerHTML='';r.rows.reverse().forEach(x=>{l.innerHTML+=`<div class=todo><span>${x.Title}</span><button onclick="del('${x.$id}')">X</button></div>`})}async function add(){const v=document.getElementById('t').value;if(!v)return;await db.createRow({databaseId:DID,tableId:TID,rowId:ID.unique(),data:{Title:v,isCompleted:false}});document.getElementById('t').value='';load()}async function del(id){await db.deleteRow({databaseId:DID,tableId:TID,rowId:id});load()}load()</script></body></html>
